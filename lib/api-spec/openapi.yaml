openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public Piece of History content
  - name: stories
    description: Authenticated stories and payment setup
  - name: payments
    description: Authenticated payment orders and Razorpay webhooks
  - name: archive
    description: Public closed Piece of History archive
  - name: history
    description: Authenticated private participant history
  - name: admin
    description: Owner-only moderation and administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stats:
    get:
      operationId: getSiteStats
      tags: [public]
      summary: Get live site statistics
      description: Returns real counts used by the public site footer.
      responses:
        "200":
          description: Site statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
  /me:
    get:
      operationId: getCurrentUser
      tags: [public]
      summary: Get the signed-in local user
      description: Creates the local user record on the first authenticated request.
      responses:
        "200":
          description: The signed-in local user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
  /competition/today:
    get:
      operationId: getTodayCompetition
      tags: [public]
      summary: Get today's active competition
      description: Returns the current active day and its ranked participants.
      responses:
        "200":
          description: Today's competition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayCompetition"
  /stories:
    post:
      operationId: createStory
      tags: [stories]
      summary: Create the signed-in user's story for today's piece
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Pending-payment story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryPaymentContext"
        "400":
          description: Invalid story or website URL
        "401":
          description: Authentication required
        "409":
          description: The user already has a story for today's piece
        "404":
          description: No active piece
  /stories/{storyId}/payment:
    get:
      operationId: getStoryPayment
      tags: [stories]
      summary: Get the signed-in owner's payment context for a story
      security:
        - clerkSession: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Story payment context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryPaymentContext"
        "401":
          description: Authentication required
        "404":
          description: Story not found
  /payments/orders:
    post:
      operationId: createPaymentOrder
      tags: [payments]
      summary: Create a server-side Razorpay USD order
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentOrderInput"
      responses:
        "201":
          description: Razorpay Standard Checkout order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "400":
          description: Invalid amount
        "401":
          description: Authentication required
        "404":
          description: Story not found
        "409":
          description: Story is no longer payable
  /payments/razorpay/webhook:
    post:
      operationId: receiveRazorpayWebhook
      tags: [payments]
      summary: Receive a verified Razorpay webhook
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema:
            type: string
        - name: x-razorpay-event-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpayWebhookPayload"
      responses:
        "200":
          description: Event accepted or safely ignored
        "400":
          description: Invalid signature or body
  /archive:
    get:
      operationId: getArchive
      tags: [archive]
      summary: Browse closed Pieces of History
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated closed days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveResponse"
  /archive/{date}:
    get:
      operationId: getArchiveDetail
      tags: [archive]
      summary: Get a public closed-day archive detail
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Closed-day winner detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveDetail"
        "404":
          description: Closed day or visible winning story not found
  /me/history:
    get:
      operationId: getMyHistory
      tags: [history]
      summary: Get the authenticated participant's private history
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated private history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyHistoryResponse"
        "401":
          description: Authentication required
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get owner-only administration overview
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Basic owner administration data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
  /admin/stories/{storyId}/hide:
    post:
      operationId: hideAdminStory
      tags: [admin]
      summary: Hide a story for abuse moderation
      security:
        - clerkSession: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Idempotent moderation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HideStoryResponse"
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: Story not found
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SiteStats:
      type: object
      properties:
        daysLaunched:
          type: integer
          minimum: 0
        users:
          type: integer
          minimum: 0
        piecesOfHistory:
          type: integer
          minimum: 0
      required:
        - daysLaunched
        - users
        - piecesOfHistory
    CompetitionParticipant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        story:
          type: string
        websiteUrl:
          type: [string, "null"]
          format: uri
        runningTotalCents:
          type: integer
          minimum: 0
        rank:
          type: integer
          minimum: 1
      required:
        - id
        - displayName
        - story
        - websiteUrl
        - runningTotalCents
        - rank
    TodayCompetition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        serverTime:
          type: string
          format: date-time
        closingTimestamp:
          type: string
          format: date-time
        minimumPaymentCents:
          type: integer
          minimum: 1
        participants:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionParticipant"
      required:
        - id
        - date
        - serverTime
        - closingTimestamp
        - minimumPaymentCents
        - participants
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: [string, "null"]
          format: email
        authProvider:
          type: string
        role:
          type: string
          enum: [user, admin]
      required:
        - id
        - displayName
        - email
        - authProvider
        - role
    StoryInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
        storyText:
          type: string
          minLength: 1
          maxLength: 500
        websiteUrl:
          type: [string, "null"]
          format: uri
      required:
        - displayName
        - storyText
    StoryPaymentContext:
      type: object
      properties:
        storyId:
          type: string
          format: uuid
        dailyPieceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending_payment, visible]
        paymentStatus:
          type: string
          enum: [pending, captured, failed]
        minimumPaymentCents:
          type: integer
          minimum: 1
        amountCents:
          type: [integer, "null"]
          minimum: 1
        currency:
          type: string
          enum: [USD]
      required:
        - storyId
        - dailyPieceId
        - status
        - paymentStatus
        - minimumPaymentCents
        - amountCents
        - currency
    PaymentOrderInput:
      type: object
      properties:
        storyId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 1
      required:
        - storyId
        - amountCents
    PaymentOrder:
      type: object
      properties:
        orderId:
          type: string
        amountCents:
          type: integer
          minimum: 1
        currency:
          type: string
          enum: [USD]
        keyId:
          type: string
      required:
        - orderId
        - amountCents
        - currency
        - keyId
    RazorpayWebhookPayload:
      type: object
      additionalProperties: true
    Pagination:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 0
      required: [total, page, pageSize, totalPages]
    ArchiveItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        winnerDisplayName:
          type: [string, "null"]
        winningStandingCents:
          type: [integer, "null"]
          minimum: 0
        participantCount:
          type: integer
          minimum: 0
      required: [id, date, winnerDisplayName, winningStandingCents, participantCount]
    ArchiveResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveItem"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [items, pagination]
    ArchiveDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        winnerDisplayName:
          type: string
        winningStory:
          type: string
        winningStandingCents:
          type: [integer, "null"]
          minimum: 0
        participantCount:
          type: integer
          minimum: 0
        winnerWebsiteUrl:
          type: [string, "null"]
          format: uri
      required: [id, date, winnerDisplayName, winningStory, winningStandingCents, participantCount, winnerWebsiteUrl]
    HistoryPayment:
      type: object
      properties:
        amountCents:
          type: integer
          minimum: 1
        capturedAt:
          type: string
          format: date-time
        paymentReference:
          type: string
      required: [amountCents, capturedAt, paymentReference]
    MyHistoryItem:
      type: object
      properties:
        dayId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        status:
          type: string
          enum: [active, closed]
        storyText:
          type: [string, "null"]
        displayName:
          type: [string, "null"]
        websiteUrl:
          type: [string, "null"]
          format: uri
        storyStatus:
          type: [string, "null"]
          enum: [visible, hidden, moderated, null]
        payments:
          type: array
          items:
            $ref: "#/components/schemas/HistoryPayment"
        finalRunningTotalCents:
          type: integer
          minimum: 0
        finalRank:
          type: [integer, "null"]
          minimum: 1
        result:
          type: string
          enum: [won, lost, in_progress]
      required: [dayId, date, status, storyText, displayName, websiteUrl, storyStatus, payments, finalRunningTotalCents, finalRank, result]
    MyHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyHistoryItem"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [items, pagination]
    AdminPayment:
      type: object
      properties:
        storyId:
          type: string
          format: uuid
        userDisplayName:
          type: string
        dayDate:
          type: string
          format: date
        amountCents:
          type: integer
          minimum: 1
        paymentReference:
          type: string
        status:
          type: string
          enum: [captured]
        capturedAt:
          type: string
          format: date-time
      required: [storyId, userDisplayName, dayDate, amountCents, paymentReference, status, capturedAt]
    AdminClosedDay:
      type: object
      properties:
        dayId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        winnerDisplayName:
          type: [string, "null"]
        winningStandingCents:
          type: [integer, "null"]
          minimum: 0
        closedAt:
          type: [string, "null"]
          format: date-time
      required: [dayId, date, winnerDisplayName, winningStandingCents, closedAt]
    AdminOverview:
      type: object
      properties:
        totalUsers:
          type: integer
          minimum: 0
        totalPiecesOfHistory:
          type: integer
          minimum: 0
        capturedPayments:
          type: array
          items:
            $ref: "#/components/schemas/AdminPayment"
        capturedPaymentsPagination:
          $ref: "#/components/schemas/Pagination"
        closedDays:
          type: array
          items:
            $ref: "#/components/schemas/AdminClosedDay"
      required: [totalUsers, totalPiecesOfHistory, capturedPayments, capturedPaymentsPagination, closedDays]
    HideStoryResponse:
      type: object
      properties:
        storyId:
          type: string
          format: uuid
        status:
          type: string
          enum: [hidden]
      required: [storyId, status]

