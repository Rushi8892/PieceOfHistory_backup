openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public Piece of History content
  - name: stories
    description: Authenticated stories and payment setup
  - name: payments
    description: Authenticated payment orders and Razorpay webhooks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stats:
    get:
      operationId: getSiteStats
      tags: [public]
      summary: Get live site statistics
      description: Returns real counts used by the public site footer.
      responses:
        "200":
          description: Site statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
  /me:
    get:
      operationId: getCurrentUser
      tags: [public]
      summary: Get the signed-in local user
      description: Creates the local user record on the first authenticated request.
      responses:
        "200":
          description: The signed-in local user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
  /competition/today:
    get:
      operationId: getTodayCompetition
      tags: [public]
      summary: Get today's active competition
      description: Returns the current active day and its ranked participants.
      responses:
        "200":
          description: Today's competition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayCompetition"
  /stories:
    post:
      operationId: createStory
      tags: [stories]
      summary: Create the signed-in user's story for today's piece
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Pending-payment story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryPaymentContext"
        "400":
          description: Invalid story or website URL
        "401":
          description: Authentication required
        "409":
          description: The user already has a story for today's piece
        "404":
          description: No active piece
  /stories/{storyId}/payment:
    get:
      operationId: getStoryPayment
      tags: [stories]
      summary: Get the signed-in owner's payment context for a story
      security:
        - clerkSession: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Story payment context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryPaymentContext"
        "401":
          description: Authentication required
        "404":
          description: Story not found
  /payments/orders:
    post:
      operationId: createPaymentOrder
      tags: [payments]
      summary: Create a server-side Razorpay USD order
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentOrderInput"
      responses:
        "201":
          description: Razorpay Standard Checkout order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "400":
          description: Invalid amount
        "401":
          description: Authentication required
        "404":
          description: Story not found
        "409":
          description: Story is no longer payable
  /payments/razorpay/webhook:
    post:
      operationId: receiveRazorpayWebhook
      tags: [payments]
      summary: Receive a verified Razorpay webhook
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema:
            type: string
        - name: x-razorpay-event-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpayWebhookPayload"
      responses:
        "200":
          description: Event accepted or safely ignored
        "400":
          description: Invalid signature or body
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SiteStats:
      type: object
      properties:
        daysLaunched:
          type: integer
          minimum: 0
        users:
          type: integer
          minimum: 0
        piecesOfHistory:
          type: integer
          minimum: 0
      required:
        - daysLaunched
        - users
        - piecesOfHistory
    CompetitionParticipant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        story:
          type: string
        websiteUrl:
          type: [string, "null"]
          format: uri
        runningTotalCents:
          type: integer
          minimum: 0
        rank:
          type: integer
          minimum: 1
      required:
        - id
        - displayName
        - story
        - websiteUrl
        - runningTotalCents
        - rank
    TodayCompetition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        serverTime:
          type: string
          format: date-time
        closingTimestamp:
          type: string
          format: date-time
        minimumPaymentCents:
          type: integer
          minimum: 1
        participants:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionParticipant"
      required:
        - id
        - date
        - serverTime
        - closingTimestamp
        - minimumPaymentCents
        - participants
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: [string, "null"]
          format: email
        authProvider:
          type: string
        role:
          type: string
          enum: [user, admin]
      required:
        - id
        - displayName
        - email
        - authProvider
        - role
    StoryInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
        storyText:
          type: string
          minLength: 1
          maxLength: 500
        websiteUrl:
          type: [string, "null"]
          format: uri
      required:
        - displayName
        - storyText
    StoryPaymentContext:
      type: object
      properties:
        storyId:
          type: string
          format: uuid
        dailyPieceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending_payment, visible]
        paymentStatus:
          type: string
          enum: [pending, captured, failed]
        minimumPaymentCents:
          type: integer
          minimum: 1
        amountCents:
          type: [integer, "null"]
          minimum: 1
        currency:
          type: string
          enum: [USD]
      required:
        - storyId
        - dailyPieceId
        - status
        - paymentStatus
        - minimumPaymentCents
        - amountCents
        - currency
    PaymentOrderInput:
      type: object
      properties:
        storyId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 1
      required:
        - storyId
        - amountCents
    PaymentOrder:
      type: object
      properties:
        orderId:
          type: string
        amountCents:
          type: integer
          minimum: 1
        currency:
          type: string
          enum: [USD]
        keyId:
          type: string
      required:
        - orderId
        - amountCents
        - currency
        - keyId
    RazorpayWebhookPayload:
      type: object
      additionalProperties: true

